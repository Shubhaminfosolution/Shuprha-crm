{% extends 'base.html' %}

{% block title %}Delete {{ object_type }} — Shuprha CRM{% endblock %}

{% block content %}
<div class="p-6 max-w-md mx-auto mt-16">
  <div class="bg-white rounded-xl border border-gray-200 p-8 text-center">
    <div class="text-4xl mb-4">🗑️</div>
    <h1 class="text-xl font-bold text-gray-800 mb-2">Delete {{ object_type }}?</h1>
    <p class="text-sm text-gray-500 mb-6">
      You're about to delete <strong>{{ object }}</strong>. This cannot be undone.
    </p>
    <form method="post" class="flex gap-3 justify-center">
      {% csrf_token %}
      <a href="{{ cancel_url }}"
         class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">
        Cancel
      </a>
      <button type="submit"
              class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition">
        Yes, Delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
